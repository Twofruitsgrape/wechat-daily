# 微信公众号每日发文 —— 主配置
# 改完直接生效，不需要重启任何东西（cron 每次运行都重新读）

# 账号显示信息（草稿箱里的作者名）
account:
  name: ""            # 公众号名字，可留空
  author: ""          # 留空则用 .env 的 WECHAT_AUTHOR

# 时区：机器时区可能不是北京时间，必须显式指定，否则早上 7 点会在半夜触发
timezone: Asia/Shanghai

article:
  min_words: 1800     # 正文汉字下限
  max_words: 2600     # 正文汉字上限（公众号阅读舒适区）
  enable_review: true # 写完后是否再跑一轮「去 AI 味 + 事实性」自检
  review_model: fast  # fast = 用 OPENCODE_MODEL_FAST

# 写作人设与硬约束（会拼进 prompt）
style:
  persona: >-
    一个有十年一线经验的工程师/研究者，说话直接，不吹不黑。
    习惯先问「这个数从哪来的」，再问「所以呢」。
  audience: >-
    有一定专业基础、但没时间读原论文的技术从业者与研究生。
  tone: >-
    冷静、具体、有观点。可以尖锐，但不阴阳怪气。
  must:
    - 每篇文章必须围绕一个具体问题，不要写成综述或大而全的科普
    - 段落长度 3-5 行（手机上一屏约 6-7 行），不要把一句话单独成段，也不要把一个意思拆成七八个小段
    - 全篇用 ==关键句== 标出 3-5 处最重要的判断，这些地方会渲染成彩色，是读者视线的落点
    - 出现数字就要交代来源类型（实测/文献/估算/假设），拿不到就写「量级上大约」并说明是估算
    - 至少给出一个「如果是我会怎么做」的具体判断
  ban:
    - 首先/其次/最后/综上所述/总而言之
    - 在这个XX的时代 / 让我们 / 众所周知
    - 赋能 / 抓手 / 闭环 / 底层逻辑 / 降维打击 / 护城河
    - 空泛的排比句和形容词堆砌
    - 编造论文、作者、期刊、DOI、具体百分比

# 排版主题（微信正文只能用内联样式）
# 数值参考了机器之心、可能吧这类排版受到同行认可的大号：
#   正文 15px / 行高 1.75 / 字间距 0.5px / 两端对齐（justify）
# 不是拍脑袋的：15px+justify 一屏能多排两行，右边缘是齐的，读起来更稳。
theme:
  font_size: 15
  line_height: 1.75
  letter_spacing: 0.5
  text_color: "#3f3f3f"
  heading_color: "#1a1a1a"
  accent_color: "#0e7c86"      # 强调色 / 重点句 / 小标题编号
  quote_bg: "#f7f7f7"
  quote_border: "#d8d8d8"
  code_bg: "#282c34"
  code_color: "#abb2bf"
  inline_code_bg: "#f2f3f5"
  inline_code_color: "#c7254e"
  link_mode: text            # text = 正文不放外链（个人号外链不可点），统一收到文末
  show_footer: true          # 文末是否加一句互动引导
  footer_text: "如果这篇有点用，转发给同样在纠结这个问题的人。有不同的判断，评论区见。"
  # 以下三项是排版质量的关键开关
  justify: true              # 中文两端对齐
  pangu: true                # 中英文、中文与数字之间自动加空格
  highlight_color: "#0e7c86" # ==重点句== 的颜色

# 封面图
cover:
  width: 900
  height: 383              # 微信 2.35:1 主封面
  theme: auto              # auto = 按日期轮换，也可固定：ink / dawn / forest / clay
  kicker: "每日一篇"        # 封面左上角小字，留空则不显示

# 话题池（可留空）
topics_file: config/topics.yaml
