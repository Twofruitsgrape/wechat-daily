# 选题配置
#
# domain  : 大方向。pool 为空时，模型会在这个方向内自己挑一个当天想写的具体问题。
# pool    : 具体选题池。写一个就从上面取一个（用过的会记进 data/state.json，不会重复）。
#           想完全自动，就保持 pool: []，让模型自由发挥。
# avoid   : 明确不写的东西。

domain: "AI 与科研工具对真实工作流的改造"

# 想指定写作角度时可以用 - topic / angle 的结构
pool: []

# 纯字符串写法也可以：
# pool:
#   - "余热回收里最常见的一个估算错误"
#   - "MVR 系统为什么在低负荷下比多效蒸发还不划算"

avoid:
  - 纯新闻搬运和发布会通稿
  - 没有一手信息的行业八卦
  - 投资建议
  - 医疗健康建议
