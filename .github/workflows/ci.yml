name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装中文字体（封面渲染需要）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: npm ci
      - run: npm run selftest

      - name: JS 语法检查
        run: |
          set -e
          git ls-files '*.js' '*.mjs' | while read -r f; do
            node --check "$f"
          done
